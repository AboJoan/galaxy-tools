name: module4

channels:
  - conda-forge
  - bioconda

channel_priority: strict

dependencies:
  # core
  - python=3.12
  - pip
  - pandas
  - numpy
  - openpyxl
  - biopython
  - matplotlib

  # workflow
  - snakemake

  # parsing / utilities
  - tqdm
  - pyyaml

  # R
  - r-base=4.3
  - r-data.table
  - r-tidyverse
  - r-tidyr
  - r-readr
  - r-dplyr
  - r-stringr
  - r-ggplot2
  - r-patchwork
  - r-scales

  # bioinformatics tools
  - blast=2.15.*
  - diamond
  - seqkit
  - parallel
